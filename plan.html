<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelGo - Plan Your Trip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="fas fa-plane-departure me-2"></i>TravelGo
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
          <li class="nav-item"><a class="nav-link active" href="plan.html">Plan Trip</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        </ul>
        <a href="plan.html" class="btn btn-primary ms-lg-3 rounded-pill px-4">Book Now</a>
      </div>
    </div>
  </nav>

  <section class="min-vh-100 d-flex align-items-stretch">
    <!-- Image Side -->
    <div class="d-none d-lg-block col-lg-5"
      style="background: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1000&q=80') no-repeat center center; background-size: cover; min-height: 100vh;">
    </div>

    <!-- Form Side -->
    <div class="col-12 col-lg-7 d-flex align-items-center bg-light">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-md-10 col-xl-8">
            <div class="text-center mb-5" data-aos="fade-up">
              <h6 class="text-primary text-uppercase fw-bold ls-2">Start Your Journey</h6>
              <h2 class="display-5 fw-bold">Plan Your Dream Trip</h2>
              <p class="text-muted">Fill out the form below and our experts will contact you within 24 hours.</p>
            </div>

            <form id="booking-form" class="bg-white p-5 rounded-4 shadow-sm" data-aos="fade-up" data-aos-delay="100">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="name" placeholder="John Doe">
                    <label for="name">Full Name</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    <label for="email">Email Address</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <select class="form-select" id="destination" aria-label="Destination">
                      <option selected>Select Destination</option>
                      <option value="1">Paris, France</option>
                      <option value="2">Bali, Indonesia</option>
                      <option value="3">Dubai, UAE</option>
                      <option value="4">Maldives</option>
                      <option value="5">Kyoto, Japan</option>
                      <option value="6">Other</option>
                    </select>
                    <label for="destination">Where to?</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="number" class="form-control" id="guests" placeholder="2">
                    <label for="guests">Number of Guests</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="date" class="form-control" id="checkin" placeholder="Check-in">
                    <label for="checkin">Departure Date</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="date" class="form-control" id="checkout" placeholder="Check-out">
                    <label for="checkout">Return Date</label>
                  </div>
                </div>

                <div class="col-12">
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Leave a comment here" id="comments"
                      style="height: 100px"></textarea>
                    <label for="comments">Additional Requests / Messages</label>
                  </div>
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill">Book My Trip</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer (Simplified) -->
  <footer class="bg-dark text-white text-center py-4">
    <div class="container">
      <small>&copy; 2026 TravelGo. All rights reserved. | <a href="index.html"
          class="text-white-50 text-decoration-none">Back to Home</a></small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      once: true
    });
  </script>
  <script src="search.js"></script>
</body>

</html>
